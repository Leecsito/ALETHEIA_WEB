<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ALETHEIA — En Vivo</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a0c'/%3E%3Ctext x='16' y='25' font-size='24' text-anchor='middle' fill='%23e8ff47' font-family='sans-serif'%3EA%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="../header/header.css" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="bg-grid"></div>
    <div class="scanlines"></div>

    <div id="aeHeaderMount"></div>

    <main>

        <!-- ── LISTA DE SIMULACIONES PREPARADAS ── -->
        <section class="sim-browser">
            <div class="lb-head">
                <div class="lb-title">SIMULACIONES PREPARADAS</div>
                <label class="lb-stale-toggle">
                    <input type="checkbox" id="chkShowStale" /> mostrar no vigentes
                </label>
                <div class="mb-spacer"></div>
                <button class="btn-refresh" id="btnRefreshSims">↻ ACTUALIZAR</button>
            </div>
            <div class="sim-list" id="simList"></div>
            <div class="live-status" id="simListStatus"></div>
        </section>

        <!-- ── DETALLE EN VIVO ── -->
        <section class="live-section" id="liveSection" style="display:none">
            <div class="sel-sim-head" id="selSimHead"></div>

            <div class="live-tabs">
                <button class="live-tab active" data-tab="mapa">MAPA / BANDO</button>
                <button class="live-tab" data-tab="serie">ARMAR SERIE</button>
                <button class="live-tab" data-tab="comparacion">COMPARACIÓN</button>
            </div>

            <!-- Tab: mapa / bando (lee de la caché, sin simular) -->
            <div class="live-panel" id="panelMapa">
                <div class="live-controls">
                    <div class="live-ctl">
                        <span class="live-ctl-label">BANDO INICIAL <span id="liveTeamALabel"
                                class="pm-team-a-label"></span></span>
                        <div class="live-side-toggle">
                            <button class="qi-side-btn qi-atk-active" id="liveSideAtk">⚔ ATK</button>
                            <button class="qi-side-btn" id="liveSideDef">🛡 DEF</button>
                        </div>
                    </div>
                    <div class="live-ctl">
                        <span class="live-ctl-label">MAPA</span>
                        <span class="live-hint">Toca un mapa · P(A) y OT según el bando elegido</span>
                    </div>
                </div>
                <div class="map-quick-picker live-map-picker" id="liveMapPicker"></div>
                <div class="live-detail-title" id="liveDetailTitle"></div>
                <div class="live-cards" id="liveCards"></div>
                <div class="live-status" id="liveStatus"></div>
            </div>

            <!-- Tab: armar serie (POST /api/serie, instantáneo) -->
            <div class="live-panel" id="panelSerie" style="display:none">
                <div class="mb-header">
                    <div class="mb-title-wrap">
                        <span class="mb-title">ARMAR SERIE</span>
                        <div class="fmt-btns" id="fmtBtns">
                            <button class="fmt-btn" data-fmt="1">BO1</button>
                            <button class="fmt-btn active" data-fmt="3">BO3</button>
                            <button class="fmt-btn" data-fmt="5">BO5</button>
                        </div>
                        <span class="mb-format" id="mbFormat">—</span>
                    </div>
                    <div class="mb-hint">
                        Elige el formato y toca los mapas para llenar los slots en orden. El último es el
                        <strong>DECIDER</strong>. El bando se elige por mapa.
                    </div>
                </div>
                <div class="map-slots" id="serieSlots"></div>
                <div class="series-banner" id="seriesBanner"></div>
                <div class="methodology-note" id="serieNote"></div>
            </div>

            <!-- Tab: comparación (predicho vs. real) -->
            <div class="live-panel" id="panelComparacion" style="display:none">
                <div class="cmp-summary" id="cmpSummary"></div>
                <div class="cmp-table-wrap" id="cmpTableWrap"></div>
                <div class="live-status" id="cmpStatus"></div>
            </div>
        </section>

    </main>

    <script>window.AE_HEADER = { title: 'EN VIVO', badge: 'PREDICTOR' };</script>
    <script src="../header/header.js"></script>
    <script src="script.js"></script>
</body>

</html>
