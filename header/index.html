<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ALETHEIA — Header</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a0c'/%3E%3Ctext x='16' y='25' font-size='24' text-anchor='middle' fill='%2338bdf8' font-family='sans-serif'%3EA%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Chakra+Petch:wght@300;400;500;600;700&family=DM+Mono:wght@300;400;500&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="header.css" />
    <style>
        :root {
            --bg: #0f0f23;
            --text: #e2e8f0;
            --mono: 'DM Mono', monospace;
            --body: 'Chakra Petch', sans-serif;
            --display: 'Russo One', sans-serif;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--body);
        }

        main {
            padding: 40px;
            max-width: 900px;
            margin: 0 auto;
        }

        code {
            color: #38bdf8;
        }
    </style>
</head>

<body>
    <!-- Componente HEADER reutilizable (página de demostración).
         Para usarlo en cualquier componente:
             <link rel="stylesheet" href="../header/header.css" />
             <div id="aeHeaderMount"></div>
             <script src="../header/header.js"></script>
         El script inyecta el marcado y marca el nav activo según la ruta. -->
    <div id="aeHeaderMount"></div>

    <main>
        <h1>Componente HEADER</h1>
        <p>Este header se inyecta con <code>header.js</code> en cada componente
            (<code>aletheia</code>, <code>aletheia_preparar</code>, <code>tablas</code>,
            <code>visualizar</code>).</p>
        <p>Config opcional por página antes de cargar el script:</p>
        <pre><code>window.AE_HEADER = { title: 'EN VIVO', badge: 'PREDICTOR' };</code></pre>
    </main>

    <script src="header.js"></script>
</body>

</html>
