<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ALETHEIA — Header</title>
    <link rel="icon" type="image/svg+xml" href="../comun/ALETHEIA_ico.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fuentes sin bloquear el render: se precargan y se aplican de forma
         asíncrona (media=print + onload). Hay fallback <noscript>. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&display=swap" />
    <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&display=swap" />
    <noscript>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&display=swap" />
    </noscript>
    <link rel="stylesheet" href="../comun/theme.min.css?v=00289f60" />
    <link rel="stylesheet" href="header.min.css?v=2f516978" />
    <style>
        body {
            margin: 0;
            background: var(--bg);
            color: var(--txt);
            font-family: var(--mono);
        }

        main {
            padding: 40px;
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            font-family: var(--display);
            letter-spacing: 3px;
        }

        code {
            color: var(--accent);
        }
    </style>
</head>

<body>
    <!-- Componente HEADER reutilizable (página de demostración).
         Para usarlo en cualquier componente:
             <link rel="stylesheet" href="header.min.css?v=2f516978" />
             <div id="aeHeaderMount"></div>
             <script src="header.min.js?v=91585dc7"></script>
         El script inyecta el marcado y marca el nav activo según la ruta. -->
    <div id="aeHeaderMount"></div>

    <main>
        <h1>Componente HEADER</h1>
        <p>Este header se inyecta con <code>header.js</code> en cada componente
            (<code>aletheia</code>, <code>aletheia_preparar</code>, <code>tablas</code>,
            <code>visualizar</code>).</p>
        <p>Config opcional por página antes de cargar el script:</p>
        <pre><code>window.AE_HEADER = { hidden: ['datos'] };</code></pre>
    </main>

    <script src="header.min.js?v=91585dc7"></script>
    <script src="header-nodes.min.js?v=126d7da6"></script>
</body>

</html>
