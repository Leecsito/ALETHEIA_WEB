<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALETHEIA — Partidos</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a0c'/%3E%3Ctext x='16' y='25' font-size='24' text-anchor='middle' fill='%2338bdf8' font-family='sans-serif'%3EA%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Chakra+Petch:wght@300;400;500;600;700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../header/header.css" />
  <link rel="stylesheet" href="../comun/vct.css" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="v-bg"></div>
  <div id="aeHeaderMount"></div>

  <nav class="vct-tabs">
    <a href="../partidos/" class="active">PARTIDOS</a>
    <a href="../equipos/">EQUIPOS</a>
    <a href="../jugadores/">JUGADORES</a>
    <a href="../eventos/">EVENTOS</a>
  </nav>

  <main class="v-main">

    <!-- ── LISTA ── -->
    <section id="vistaLista">
      <div class="v-title">
        <h1>PARTIDOS</h1>
        <span class="v-count" id="count"></span>
      </div>

      <div class="v-controls">
        <input id="q" class="v-input" placeholder="Buscar equipo, torneo, fase..." />
        <select id="f-torneo" class="v-select"><option value="">TODOS LOS TORNEOS</option></select>
        <select id="f-year" class="v-select"><option value="">TODOS LOS AÑOS</option></select>
        <select id="f-orden" class="v-select">
          <option value="recientes">MÁS RECIENTES</option>
          <option value="antiguos">MÁS ANTIGUOS</option>
        </select>
      </div>

      <div id="lista"></div>
      <div class="v-pager" id="pager"></div>
    </section>

    <!-- ── DETALLE ── -->
    <section id="vistaDetalle" hidden></section>

  </main>

  <div class="v-loading hidden" id="vLoading">
    <div class="v-spinner"></div>
    <div class="txt">CARGANDO...</div>
  </div>

  <script>window.AE_HEADER = { title: 'PARTIDOS', badge: 'VCT' };</script>
  <script src="../header/header.js"></script>
  <script src="../comun/vct.js"></script>
  <script src="script.js"></script>
</body>

</html>
