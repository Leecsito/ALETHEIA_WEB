<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALETHEIA — Eventos</title>
  <link rel="icon" type="image/svg+xml" href="../comun/ALETHEIA_ico.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../comun/theme.css" />

  <link rel="stylesheet" href="style.css" />

<body>

  <div class="v-bg"></div>
  <div id="aeHeaderMount"></div>

    <a href="../equipos/">EQUIPOS</a>
    <a href="../jugadores/">JUGADORES</a>
    <a href="../eventos/" class="active">EVENTOS</a>
  </nav>

  <main class="v-main">

    <!-- ── LISTA ── -->
    <section id="vistaLista">
      <div class="v-title">
        <h1>EVENTOS</h1>
        <span class="v-count" id="count"></span>
      </div>

      <div class="v-controls">
        <input id="q" class="v-input" placeholder="Buscar evento o torneo..." />

      <div class="v-grid" id="grid"></div>
    </section>

    <!-- ── DETALLE ── -->
    <section id="vistaDetalle" hidden></section>

  </main>

  <div class="v-loading hidden" id="vLoading">
    <div class="v-spinner"></div>
    <div class="txt">CARGANDO...</div>
  </div>

  <script>window.AE_HEADER = { title: 'EVENTOS', badge: 'VCT' };</script>
  <script src="../header/header.js"></script>
  <script src="../header/header-nodes.js"></script>
  <script src="../comun/vct.js"></script>
  <script src="script.js"></script>

</html>
