<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ALETHEIA — Preparar Partido</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a0c'/%3E%3Ctext x='16' y='25' font-size='24' text-anchor='middle' fill='%23e8ff47' font-family='sans-serif'%3EA%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="../header/header.css" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="bg-grid"></div>
    <div class="scanlines"></div>

    <div id="aeHeaderMount"></div>

    <main>

        <!-- ── SELECCIÓN DE EQUIPOS ── -->
        <section class="selector-section">
            <div class="team-panel" id="panelA">
                <div class="team-panel-label">EQUIPO A</div>
                <div class="selected-team" id="selectedA">
                    <span class="sel-placeholder">Selecciona un equipo</span>
                </div>
                <input class="team-search" id="searchA" placeholder="Buscar equipo..." autocomplete="off" />
                <div class="team-grid" id="teamGridA"></div>
            </div>

            <div class="vs-column">
                <div class="vs-text">VS</div>
                <div class="sim-options">
                    <div class="sim-label">SIMULACIONES</div>
                    <div class="sim-btns">
                        <button class="sim-btn" data-n="1000">1K</button>
                        <button class="sim-btn" data-n="5000">5K</button>
                        <button class="sim-btn active" data-n="10000">10K</button>
                    </div>
                </div>
            </div>

            <div class="team-panel" id="panelB">
                <div class="team-panel-label">EQUIPO B</div>
                <div class="selected-team" id="selectedB">
                    <span class="sel-placeholder">Selecciona un equipo</span>
                </div>
                <input class="team-search" id="searchB" placeholder="Buscar equipo..." autocomplete="off" />
                <div class="team-grid" id="teamGridB"></div>
            </div>
        </section>

        <!-- ── PANEL PREPARAR ── -->
        <div class="match-builder" id="preparePanel" style="display:none">
            <div class="partido-id-bar">
                <div class="pid-label">PARTIDO (vlr.gg)</div>
                <input class="pid-input" id="matchIdInput"
                    placeholder="https://www.vlr.gg/753455/... o 753455" autocomplete="off" />
                <span class="pid-badge" id="matchIdBadge">SIN ID</span>
                <button class="btn-asociar" id="btnAsociar" disabled>⇄ ASOCIAR ID</button>
                <span class="model-badge" id="modelBadge"></span>
                <span class="cache-badge" id="cacheBadge"></span>
            </div>

            <div class="mb-actions">
                <div class="prepare-hint">
                    Se calculan los <strong>13 mapas × 2 lados = 26 combinaciones</strong>.
                    No cierres esta pestaña mientras se prepara.
                </div>
                <div class="mb-spacer"></div>
                <button class="btn-preparar" id="btnPreparar" disabled>
                    <span class="bp-icon">⚙</span>
                    <span class="bp-text">PREPARAR PARTIDO</span>
                    <span class="bp-timer" id="prepareTimer"></span>
                </button>
            </div>
            <div class="prepare-status" id="prepareStatus" style="display:none"></div>
        </div>

    </main>

    <script>window.AE_HEADER = { title: 'PREPARAR', badge: 'PARTIDO' };</script>
    <script src="../header/header.js"></script>
    <script src="script.js"></script>
</body>

</html>
