services:
  - type: web
    name: aletheia-web
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --worker-class gthread --workers 1 --threads 4 --timeout 300 --graceful-timeout 30
    envVars:
      - key: ALETHEIA_PREDICT_URL
        value: https://snugly-encore-sweep.ngrok-free.dev
      - key: ALETHEIA_PREDICT_READ_URL
        sync: false          # servicio de lecturas en Render; si falta, usa ALETHEIA_PREDICT_URL
      - key: TURSO_DATABASE_URL
        value: libsql://aletheia-laperradeadrelees.aws-us-east-1.turso.io
      - key: TURSO_AUTH_TOKEN
        sync: false          # rotar el token en Turso y fijarlo en el panel (secreto)
      - key: ALETHEIA_API_KEY
        sync: false          # misma clave que ALETHEIA_PREDICT (secreto)
