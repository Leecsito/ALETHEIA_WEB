<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALETHEIA — Jugadores</title>
  <link rel="icon" type="image/svg+xml" href="../ALETHEIA_ico.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../comun/theme.css" />
  <link rel="stylesheet" href="../header/header.css" />
  <link rel="stylesheet" href="../comun/vct.css" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="v-bg"></div>
  <div id="aeHeaderMount"></div>

  <nav class="vct-tabs">
    <a href="../partidos/">PARTIDOS</a>
    <a href="../equipos/">EQUIPOS</a>
    <a href="../jugadores/" class="active">JUGADORES</a>
    <a href="../eventos/">EVENTOS</a>
  </nav>

  <main class="v-main wide">

    <!-- ── LISTA ── -->
    <section id="vistaLista">
      <div class="v-title">
        <h1>JUGADORES</h1>
        <span class="v-count" id="count"></span>
      </div>

      <div class="v-controls">
        <input id="q" class="v-input" placeholder="Buscar jugador, nombre real o equipo..." />
        <select id="orden" class="v-select">
          <option value="rating">ORDENAR POR RATING</option>
          <option value="acs">ORDENAR POR ACS</option>
          <option value="kd">ORDENAR POR K/D</option>
          <option value="matches">ORDENAR POR PARTIDOS</option>
          <option value="nombre">ORDENAR POR NOMBRE</option>
        </select>
      </div>

      <div id="lista" style="overflow-x:auto"></div>
      <div class="v-pager" id="mas"></div>
    </section>

    <!-- ── DETALLE ── -->
    <section id="vistaDetalle" hidden></section>

  </main>

  <div class="v-loading hidden" id="vLoading">
    <div class="v-spinner"></div>
    <div class="txt">CARGANDO...</div>
  </div>

  <script>window.AE_HEADER = { title: 'JUGADORES', badge: 'VCT' };</script>
  <script src="../header/header.js"></script>
  <script src="../header/header-nodes.js"></script>
  <script src="../comun/vct.js"></script>
  <script src="script.js"></script>
</body>

</html>
